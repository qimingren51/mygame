# 推送到 master 后，构建网页小游戏站点（web/）并发布到 GitHub Pages。
# 每次推送都运行、不按路径过滤：如果仓库的 Pages 来源还是“从分支部署”，GitHub 会对仓库根目录
# 另跑一次 Jekyll 部署（根目录现在不是网站），需要这里的部署覆盖它。Pages 来源改成
# “GitHub Actions”之后，可以加回 paths: ['web/**'] 过滤。
# 需要在仓库 Settings → Pages → Source 选择 “GitHub Actions”。
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'web/*/package-lock.json'
      - name: 构建整站
        run: node web/scripts/build-site.mjs --ci
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/_site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
