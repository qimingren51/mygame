# 推送到 master 且 web/ 有改动时，构建网页小游戏站点并发布到 GitHub Pages。
# 需要在仓库 Settings → Pages → Source 选择 “GitHub Actions”。
name: Pages

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'web/*/package-lock.json'
      - name: 安装浏览器
        # 使用项目锁定的 Playwright 版本。
        run: |
          npm ci --prefix web/lantern-next
          cd web/lantern-next
          npx playwright install --with-deps chromium
      - name: 类型、单元和构建检查
        run: node web/scripts/build-site.mjs --ci
      - name: 浏览器流程检查
        run: npm --prefix web/lantern-next run e2e
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: web/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
